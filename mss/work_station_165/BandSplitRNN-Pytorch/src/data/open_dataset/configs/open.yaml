# global dataset samplerate
sample_rate: 44100.0

# Define the Input sources for each track
sources:
    violin: violin.wav
    piano: piano.wav

# Additionally provide the artistic mix
mixture:
    mixture.wav

stem_ids:
    mixture: 0
    violin: 1
    piano: 2

# Define output targets to be tested using linear mixtures
targets:
    violin:
        violin: 1
    piano:
        piano: 1
    linear_mixture:
        violin: 1
        piano: 1

